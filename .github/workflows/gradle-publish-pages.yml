name: Publish Maven to GitHub Pages (via /docs in 1.16.5-Forge)

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 1.16.5-Forge branch
        uses: actions/checkout@v4
        with:
          ref: 1.16.5-Forge
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to Maven (outputs to docs/)
        run: ./gradlew publish

      - name: Commit updated docs/maven
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/maven
          git commit -m "Publish Maven package to GitHub Pages [CI]" || echo "No changes to commit"

      - name: Push changes to 1.16.5-Forge branch
        run: git push origin 1.16.5-Forge
