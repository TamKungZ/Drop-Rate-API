name: Publish Maven to GitHub Pages

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish to local Maven repo (docs/maven)
        run: ./gradlew publish

      - name: Copy Maven files to docs/ if not already
        run: |
          mkdir -p docs
          cp -r build/repo docs/maven || true

      - name: Push to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Publish Maven package to GitHub Pages [CI]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
